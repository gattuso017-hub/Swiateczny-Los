<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Świąteczny Los 🎄</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: url('https://i.ibb.co/tBf5G6/christmas-bg.jpg') center/cover fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,.95);
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
    text-align: center;
}

h1 { color: #b30000; cursor: pointer; }
h2 { color: #333; }

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0 20px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

.groups {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 20px;
}

/* Domyślnie wszystkie grupy mają taki sam wygląd. */
.group-button {
    padding: 18px 5px;
    border: none;
    border-radius: 12px;
    background: #b30000;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: background .2s, transform .2s;
}

.group-button:hover:not(:disabled) {
    background: #850000;
    transform: scale(1.04);
}

/* Szare są tylko grupy już zajęte. */
.group-button:disabled,
.group-button.taken {
    background: #aaa !important;
    color: #eee !important;
    cursor: not-allowed;
    opacity: .7;
    transform: none;
}

#available {
    margin-top: 20px;
    padding: 12px;
    background: #f5f5f5;
    border-radius: 10px;
}

.available-names { color: #b30000; font-weight: bold; }

#result {
    margin-top: 25px;
    padding: 20px;
    background: #f5f5f5;
    border-radius: 15px;
    font-size: 18px;
    line-height: 1.5;
}

.warning { color: #b30000; font-weight: bold; }
.success { color: #168a2f; font-weight: bold; }
.winner { margin-top: 10px; font-size: 24px; color: #b30000; }

#qrCode {
    margin-top: 25px;
    display: flex;
    justify-content: center;
}

#adminPanel, #adminLogin {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #f0f0f0;
    border-radius: 12px;
}

.admin-button {
    padding: 12px 16px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    cursor: pointer;
}

#adminLogs {
    margin-top: 20px;
    max-height: 400px;
    overflow-y: auto;
    text-align: left;
}

.log {
    padding: 12px;
    margin-bottom: 10px;
    background: white;
    border-radius: 8px;
    line-height: 1.5;
}

.log strong { color: #b30000; }

@media (max-width: 500px) {
    .container { padding: 20px; }
    .groups { gap: 5px; }
    .group-button { padding: 15px 3px; font-size: 17px; }
}
</style>
</head>

<body>
<div class="container">
    <h1 id="title">🎄 Świąteczny Los 🎁</h1>

    <p>Wpisz swoje imię i wybierz dostępną grupę.</p>
    <input id="nameInput" type="text" placeholder="Wpisz swoje imię..." autocomplete="off">

    <div id="available">Sprawdzanie dostępności...</div>

    <h2>Wybierz grupę</h2>
    <div class="groups">
        <button class="group-button" data-group="1">A</button>
        <button class="group-button" data-group="2">B</button>
        <button class="group-button" data-group="3">C</button>
        <button class="group-button" data-group="4">D</button>
        <button class="group-button" data-group="5">E</button>
    </div>

    <div id="result"></div>
    <div id="qrCode"></div>

    <div id="adminPanel">
        <h2>🔐 Panel administratora</h2>

        <div id="adminLogin">
            <input id="adminEmail" type="email" placeholder="E-mail administratora">
            <input id="adminPassword" type="password" placeholder="Hasło administratora">
            <button class="admin-button" id="adminLoginButton">Zaloguj</button>
            <div id="adminLoginResult"></div>
        </div>

        <div id="adminControls" style="display:none">
            <button class="admin-button" id="loadLogs">Pokaż wyniki</button>
            <button class="admin-button" id="resetData">Resetuj losowanie 2026</button>
            <button class="admin-button" id="adminLogout">Wyloguj</button>
            <div id="adminLogs"></div>
        </div>
    </div>
</div>

<script>
"use strict";

// ------------------------------------------------------------
// FIREBASE — użyj danych ze swojej istniejącej aplikacji.
// ------------------------------------------------------------

const firebaseConfig = {
    apiKey: "AIzaSyCsLwn69mSEbZNJOnaEKxZMEBGc_9nF3j4",
    authDomain: "swiateczny-los.firebaseapp.com",
    projectId: "swiateczny-los",
    storageBucket: "swiateczny-los.firebasestorage.app",
    messagingSenderId: "106728824953",
    appId: "1:106728824953:web:0b317e165afecc3fb734a8"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

const CURRENT_YEAR = 2026;
const ADMIN_UID = "CvINwgBdgIUcusVXDkgyAP9Xhvs2";

const groups = {
    1: ["Magda", "Kazek", "Ania", "Mikołaj"],
    2: ["Anna", "Jan"],
    3: ["Sabina", "Artur", "Wiktoria"],
    4: ["Madzia", "Jarek", "Krzyś"],
    5: ["Kasia", "Kamil", "Franuś"]
};

const users = ["Kasia", "Jarek", "Sabina", "Anna", "Magda"];

const userGroups = {
    "Kasia": 5,
    "Jarek": 4,
    "Sabina": 3,
    "Anna": 2,
    "Magda": 1
};

const drawCollection = db.collection("draws");
const lockCollection = db.collection("groupLocks");
const groupNumbers = Object.keys(groups).map(Number);

const nameInput = document.getElementById("nameInput");
const availableDiv = document.getElementById("available");
const resultDiv = document.getElementById("result");
const qrCodeDiv = document.getElementById("qrCode");
const groupButtons = [...document.querySelectorAll(".group-button")];
const adminPanel = document.getElementById("adminPanel");
const adminLogin = document.getElementById("adminLogin");
const adminControls = document.getElementById("adminControls");
const adminLogs = document.getElementById("adminLogs");
const adminLoginResult = document.getElementById("adminLoginResult");

function escapeHtml(value) {
    const el = document.createElement("span");
    el.textContent = String(value ?? "");
    return el.innerHTML;
}

function groupLetter(number) {
    return String.fromCharCode(64 + Number(number));
}

function drawId(user) {
    return `${CURRENT_YEAR}_${user}`;
}

function lockId(group) {
    return `${CURRENT_YEAR}_${group}`;
}

function isAdmin() {
    return Boolean(
        auth.currentUser &&
        !auth.currentUser.isAnonymous &&
        auth.currentUser.uid === ADMIN_UID
    );
}

// ------------------------------------------------------------
// Sprawdzenie, czy pozostałe osoby nadal mogą wylosować
// różne grupy, z wyłączeniem własnych grup.
// ------------------------------------------------------------

function canCompleteAssignment(remainingUsers, availableGroups) {
    if (remainingUsers.length !== availableGroups.length) return false;
    if (remainingUsers.length === 0) return true;

    let chosenUser = null;
    let chosenOptions = null;

    for (const user of remainingUsers) {
        const options = availableGroups.filter(
            group => userGroups[user] !== group
        );

        if (chosenOptions === null || options.length < chosenOptions.length) {
            chosenUser = user;
            chosenOptions = options;
        }
    }

    if (!chosenOptions || chosenOptions.length === 0) return false;

    const nextUsers = remainingUsers.filter(user => user !== chosenUser);

    for (const group of chosenOptions) {
        const nextGroups = availableGroups.filter(g => g !== group);

        if (canCompleteAssignment(nextUsers, nextGroups)) return true;
    }

    return false;
}

// ------------------------------------------------------------
// Odczyt zajętych grup i osób, które już losowały.
// ------------------------------------------------------------

async function readDrawState() {
    const drawRefs = users.map(user => drawCollection.doc(drawId(user)));
    const lockRefs = groupNumbers.map(group => lockCollection.doc(lockId(group)));

    const drawDocs = await Promise.all(drawRefs.map(ref => ref.get()));
    const lockDocs = await Promise.all(lockRefs.map(ref => ref.get()));

    const drawnUsers = new Set();
    const takenGroups = new Set();

    drawDocs.forEach(doc => {
        if (!doc.exists) return;

        const data = doc.data();
        if (users.includes(data.user)) drawnUsers.add(data.user);

        const group = Number(data.group);
        if (groupNumbers.includes(group)) takenGroups.add(group);
    });

    lockDocs.forEach(doc => {
        if (!doc.exists) return;

        const group = Number(doc.data().group);
        if (groupNumbers.includes(group)) takenGroups.add(group);
    });

    return { drawnUsers, takenGroups };
}

// ------------------------------------------------------------
// KLUCZOWA ZMIANA:
// funkcja NIE sprawdza imienia wpisanego w polu.
// Przycisk jest szary wyłącznie wtedy, gdy grupa jest zajęta.
// ------------------------------------------------------------

async function updateGroupButtons() {
    try {
        const { takenGroups } = await readDrawState();

        groupButtons.forEach(button => {
            const group = Number(button.dataset.group);
            const isTaken = takenGroups.has(group);

            button.disabled = isTaken;
            button.classList.toggle("taken", isTaken);
            button.title = isTaken ? "Ta grupa została już wykorzystana." : "";
        });
    } catch (error) {
        console.error("Nie udało się sprawdzić grup:", error);

        // Brak odpowiedzi z bazy nie może oznaczać,
        // że własna grupa uczestnika jest ujawniana kolorem.
        groupButtons.forEach(button => {
            button.disabled = false;
            button.classList.remove("taken");
            button.title = "";
        });
    }
}

async function updateAvailableUsers() {
    try {
        const { drawnUsers } = await readDrawState();
        const available = users.filter(user => !drawnUsers.has(user));

        availableDiv.innerHTML = available.length
            ? "Dostępni do losowania: <strong class='available-names'>" +
              escapeHtml(available.join(", ")) + "</strong>"
            : "🎉 Wszyscy już dokonali losowania!";
    } catch (error) {
        console.error(error);
        availableDiv.textContent = "Nie udało się odczytać dostępności.";
    }
}

async function updateEverything() {
    await Promise.all([updateGroupButtons(), updateAvailableUsers()]);
}

// Wpisywanie imienia NIE zmienia klas ani kolorów grup.
nameInput.addEventListener("input", () => {
    resultDiv.textContent = "";
    qrCodeDiv.innerHTML = "";
});

// ------------------------------------------------------------
// LOSOWANIE
// ------------------------------------------------------------

groupButtons.forEach(button => {
    button.addEventListener("click", async () => {
        const selectedName = nameInput.value.trim();
        const selectedGroup = Number(button.dataset.group);

        if (!selectedName) {
            resultDiv.innerHTML =
                "<span class='warning'>Najpierw wpisz swoje imię.</span>";
            return;
        }

        if (!users.includes(selectedName)) {
            resultDiv.innerHTML =
                "<span class='warning'>Nie znaleziono tego imienia.</span>";
            return;
        }

        resultDiv.textContent = "⏳ Sprawdzanie losowania...";
        groupButtons.forEach(btn => btn.disabled = true);

        try {
            await db.runTransaction(async transaction => {
                const drawRefs = users.map(user =>
                    drawCollection.doc(drawId(user))
                );

                const lockRefs = groupNumbers.map(group =>
                    lockCollection.doc(lockId(group))
                );

                const drawDocs = await Promise.all(
                    drawRefs.map(ref => transaction.get(ref))
                );

                const lockDocs = await Promise.all(
                    lockRefs.map(ref => transaction.get(ref))
                );

                const drawnUsers = new Set();
                const takenGroups = new Set();

                drawDocs.forEach(doc => {
                    if (!doc.exists) return;

                    const data = doc.data();
                    if (users.includes(data.user)) drawnUsers.add(data.user);

                    const group = Number(data.group);
                    if (groupNumbers.includes(group)) takenGroups.add(group);
                });

                lockDocs.forEach(doc => {
                    if (!doc.exists) return;

                    const group = Number(doc.data().group);
                    if (groupNumbers.includes(group)) takenGroups.add(group);
                });

                if (drawnUsers.has(selectedName)) {
                    throw new Error("ALREADY_DRAWN");
                }

                if (takenGroups.has(selectedGroup)) {
                    throw new Error("GROUP_TAKEN");
                }

                // Własna grupa sprawdzana dopiero po kliknięciu.
                if (userGroups[selectedName] === selectedGroup) {
                    throw new Error("OWN_GROUP");
                }

                const remainingUsers = users.filter(
                    user => !drawnUsers.has(user) && user !== selectedName
                );

                const remainingGroups = groupNumbers.filter(
                    group => !takenGroups.has(group) && group !== selectedGroup
                );

                if (!canCompleteAssignment(remainingUsers, remainingGroups)) {
                    throw new Error("WOULD_BLOCK_REMAINING_USER");
                }

                transaction.set(
                    drawCollection.doc(drawId(selectedName)),
                    {
                        year: CURRENT_YEAR,
                        user: selectedName,
                        group: selectedGroup,
                        winnerMembers: groups[selectedGroup],
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }
                );

                transaction.set(
                    lockCollection.doc(lockId(selectedGroup)),
                    {
                        year: CURRENT_YEAR,
                        group: selectedGroup,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }
                );
            });

            resultDiv.innerHTML =
                "<span class='success'>🎉 Losowanie zakończone!</span>" +
                "<div class='winner'>Twoja grupa: " +
                escapeHtml(groupLetter(selectedGroup)) + "</div>" +
                "<br>👥 Osoby w grupie:<br><strong>" +
                escapeHtml(groups[selectedGroup].join(", ")) + "</strong>";

            qrCodeDiv.innerHTML = "";
            new QRCode(qrCodeDiv, {
                text: window.location.href,
                width: 150,
                height: 150
            });

        } catch (error) {
            console.error(error);

            const messages = {
                ALREADY_DRAWN: "To imię ma już wykonane losowanie.",
                GROUP_TAKEN: "Ta grupa jest już zajęta. Wybierz inną.",
                OWN_GROUP: "Nie możesz wylosować własnej grupy. Wybierz inną.",
                WOULD_BLOCK_REMAINING_USER:
                    "Ten wybór uniemożliwiłby dokończenie losowania. Wybierz inną grupę."
            };

            resultDiv.innerHTML =
                "<span class='warning'>" +
                escapeHtml(messages[error.message] || "Wystąpił błąd. Spróbuj ponownie.") +
                "</span>";
        } finally {
            await updateEverything();
        }
    });
});

// ------------------------------------------------------------
// Aktualizacje na żywo.
// ------------------------------------------------------------

function setupRealtimeUpdates() {
    drawCollection.where("year", "==", CURRENT_YEAR).onSnapshot(
        () => updateAvailableUsers(),
        error => console.error(error)
    );

    lockCollection.where("year", "==", CURRENT_YEAR).onSnapshot(
        () => updateGroupButtons(),
        error => console.error(error)
    );
}

// ------------------------------------------------------------
// PANEL ADMINISTRATORA — podwójne kliknięcie nagłówka.
// ------------------------------------------------------------

document.getElementById("title").addEventListener("dblclick", () => {
    adminPanel.style.display = "block";
    adminLogin.style.display = "block";
});

document.getElementById("adminLoginButton").addEventListener("click", async () => {
    try {
        await auth.signInWithEmailAndPassword(
            document.getElementById("adminEmail").value.trim(),
            document.getElementById("adminPassword").value
        );

        if (!isAdmin()) {
            await auth.signOut();
            throw new Error("NOT_ADMIN");
        }

        adminLogin.style.display = "none";
        adminControls.style.display = "block";
        adminLoginResult.textContent = "";
    } catch (error) {
        adminLoginResult.innerHTML =
            "<span class='warning'>" +
            (error.message === "NOT_ADMIN"
                ? "To konto nie ma uprawnień administratora."
                : "Nie udało się zalogować.") +
            "</span>";
    }
});

document.getElementById("loadLogs").addEventListener("click", async () => {
    if (!isAdmin()) {
        alert("Brak uprawnień administratora.");
        return;
    }

    try {
        const snapshot = await drawCollection
            .where("year", "==", CURRENT_YEAR).get();

        adminLogs.innerHTML = "";

        if (snapshot.empty) {
            adminLogs.textContent = "Brak wyników.";
            return;
        }

        snapshot.docs.forEach(doc => {
            const data = doc.data();
            const group = Number(data.group);
            const div = document.createElement("div");
            div.className = "log";

            div.innerHTML =
                "👤 <strong>" + escapeHtml(data.user) + "</strong>" +
                "<br>🎯 Grupa: <strong>" + escapeHtml(groupLetter(group)) + "</strong>" +
                "<br>👥 " + escapeHtml((groups[group] || []).join(", "));

            adminLogs.appendChild(div);
        });
    } catch (error) {
        console.error(error);
        adminLogs.textContent = "Nie udało się pobrać wyników.";
    }
});

document.getElementById("resetData").addEventListener("click", async () => {
    if (!isAdmin()) {
        alert("Brak uprawnień administratora.");
        return;
    }

    if (prompt("Wpisz RESET, aby usunąć wyniki losowania 2026.") !== "RESET") {
        return;
    }

    try {
        const [draws, locks] = await Promise.all([
            drawCollection.where("year", "==", CURRENT_YEAR).get(),
            lockCollection.where("year", "==", CURRENT_YEAR).get()
        ]);

        const refs = [
            ...draws.docs.map(doc => doc.ref),
            ...locks.docs.map(doc => doc.ref)
        ];

        for (let i = 0; i < refs.length; i += 450) {
            const batch = db.batch();
            refs.slice(i, i + 450).forEach(ref => batch.delete(ref));
            await batch.commit();
        }

        alert("Losowanie zostało zresetowane.");
        adminLogs.innerHTML = "";
        resultDiv.innerHTML = "";
        qrCodeDiv.innerHTML = "";
        await updateEverything();
    } catch (error) {
        console.error(error);
        alert("Nie udało się zresetować losowania.");
    }
});

document.getElementById("adminLogout").addEventListener("click", async () => {
    try {
        await auth.signOut();
        adminControls.style.display = "none";
        adminLogin.style.display = "block";
        adminLogs.innerHTML = "";
        await auth.signInAnonymously();
    } catch (error) {
        console.error(error);
        alert("Nie udało się wylogować.");
    }
});

// ------------------------------------------------------------
// START
// ------------------------------------------------------------

async function startApplication() {
    try {
        if (!auth.currentUser) {
            await auth.signInAnonymously();
        }

        await updateEverything();
        setupRealtimeUpdates();
    } catch (error) {
        console.error("Błąd startu:", error);
        availableDiv.textContent = "Nie udało się połączyć z bazą danych.";
    }
}

startApplication();
</script>
</body>
</html>
