<!DOCTYPE html> <html lang="pl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Losowanie prezentów</title> <!-- Firebase --> <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script> <!-- QR Code --> <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script> <style> html, body { margin: 0; padding: 0; height: 100%; } body { font-family: Arial, sans-serif; background: url('https://i.ibb.co/tBf5G6/christmas-bg.jpg') no-repeat center center fixed; background-size: cover; color: #fff; display: flex; justify-content: center; align-items: center; } .container { background-color: rgba(0,0,0,0.7); padding: 40px; border-radius: 20px; width: 90%; max-width: 700px; text-align: center; } h1 { color: #ffdd00; text-shadow: 2px 2px #b30000; cursor: pointer; } button { padding: 12px 25px; font-size: 18px; background-color: #b30000; color: white; border: none; border-radius: 10px; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; } button:hover { background-color: #ff3333; } button:disabled { background-color: #777; cursor: not-allowed; } select, input { padding: 8px; font-size: 16px; margin: 10px; border-radius: 5px; border: 1px solid #ffdd00; } #result { margin-top: 20px; font-weight: bold; font-size: 18px; background-color: rgba(255,255,255,0.8); color: #000; padding: 10px; border-radius: 10px; } option:disabled { color: gray; } #availableUsers { margin-bottom: 20px; font-weight: bold; font-size: 16px; background-color: rgba(255,255,255,0.8); color: #000; padding: 10px; border-radius: 5px; } #adminPanel { margin-top: 30px; display: none; background-color: rgba(255,255,255,0.95); color: #000; padding: 15px; border-radius: 10px; } #logs { width: 95%; max-width: 600px; } #qrcode { margin-top: 20px; } .adminButton { background-color: #555; font-size: 15px; margin: 5px; } .resetButton { background-color: #8b0000; } .info { margin-top: 15px; font-size: 14px; } </style> </head> <body> <div class="container"> <h1>🎄 Świąteczny Los 🎄</h1> <div id="availableUsers"> Ładowanie dostępnych uczestników... </div> <label for="name"> Wpisz swój login do losowania z dostępnej listy: </label> <br> <input type="text" id="name" placeholder="Twoje imię" autocomplete="off" > <br> <label for="groupSelect"> Wybierz grupę: </label> <select id="groupSelect"> <option value="1">Grupa A</option> <option value="2">Grupa B</option> <option value="3">Grupa C</option> <option value="4">Grupa D</option> <option value="5">Grupa E</option> </select> <br> <button id="drawButton" onclick="drawGroup()"> Losuj grupę </button> <div id="result"></div> <div id="qrcode"></div> <div id="adminPanel"> <h2>👑 Panel Administratora</h2> <h3>Logi losowania 2026</h3> <textarea id="logs" rows="12" readonly ></textarea> <br> <button class="adminButton" onclick="loadLogs()" > 🔄 Odśwież logi </button> <button class="adminButton resetButton" onclick="resetCurrentYear()" > 🗑️ Resetuj losowanie 2026 </button> <div class="info"> Reset usuwa tylko wyniki z 2026. Dane z poprzednich lat pozostają w bazie. </div> </div> </div> <script> /************************************************* * USTAWIENIA *************************************************/ const CURRENT_YEAR = 2026; const ADMIN_PASSWORD = 'Visiativ17'; /************************************************* * FIREBASE *************************************************/ const firebaseConfig = { apiKey: "AIzaSyCsLwn69mSEbZNJOnaEKxZMEBGc_9nF3j4", authDomain: "swiateczny-los.firebaseapp.com", projectId: "swiateczny-los", storageBucket: "swiateczny-los.firebasestorage.app", messagingSenderId: "106728824953", appId: "1:106728824953:web:0b317e165afecc3fb734a8" }; firebase.initializeApp(firebaseConfig); const db = firebase.firestore(); /************************************************* * GRUPY *************************************************/ const groups = { 1: ['Anna', 'Jan'], 2: ['Madzia', 'Kazek', 'Ania', 'Mikołaj'], 3: ['Kasia', 'Kamil', 'Franuś'], 4: ['Sabina', 'Artur', 'Wiktoria'], 5: ['Madzia', 'Jarek', 'Krzyś'] }; /************************************************* * UCZESTNICY *************************************************/ const users = [ 'Kasia', 'Jarek', 'Sabina', 'Anna', 'Magda' ]; const userGroups = { 'Kasia': 3, 'Jarek': 5, 'Sabina': 4, 'Anna': 1, 'Magda': 2 }; /************************************************* * ELEMENTY STRONY *************************************************/ const resultDiv = document.getElementById('result'); const select = document.getElementById('groupSelect'); const availableDiv = document.getElementById('availableUsers'); const drawButton = document.getElementById('drawButton'); /************************************************* * IDENTYFIKATORY DOKUMENTÓW *************************************************/ function drawDocumentId(user) { return `${CURRENT_YEAR}_${user}`; } function groupDocumentId(groupNum) { return `${CURRENT_YEAR}_${groupNum}`; } /************************************************* * POBIERANIE AKTUALNIE ZAJĘTYCH GRUP *************************************************/ async function getTakenGroups() { const snapshot = await db .collection('groupLocks') .where('year', '==', CURRENT_YEAR) .get(); return snapshot.docs.map( doc => doc.data().groupNum ); } /************************************************* * SPRAWDZENIE CZY UŻYTKOWNIK JUŻ LOSOWAŁ *************************************************/ async function getUserDraw(user) { const doc = await db .collection('draws') .doc(drawDocumentId(user)) .get(); if (!doc.exists) { return null; } return doc.data(); } /************************************************* * AKTUALIZACJA LISTY DOSTĘPNYCH GRUP *************************************************/ async function updateAvailableGroups() { try { const takenGroups = await getTakenGroups(); for (let option of select.options) { const groupNum = Number(option.value); option.disabled = takenGroups.includes(groupNum); } const availableUsers = users.filter(user => { const group = userGroups[user]; return !takenGroups.includes(group); }); if (availableUsers.length > 0) { availableDiv.textContent = 'Dostępni do losowania: ' + availableUsers.join(', '); } else { availableDiv.textContent = '🎉 Wszystkie grupy zostały już wylosowane!'; } } catch (error) { console.error(error); availableDiv.textContent = '⚠️ Nie udało się pobrać danych z Firebase.'; } } /************************************************* * SPRAWDZENIE CZY UŻYTKOWNIK JUŻ WYBRAŁ *************************************************/ async function checkUserStatus() { const name = document.getElementById('name') .value .trim(); if (!users.includes(name)) { return; } try { const existing = await getUserDraw(name); if (existing) { resultDiv.textContent = `⚠️ ${name}, już dokonałeś wyboru w ${CURRENT_YEAR}. ` + `Wybrałeś Grupę ${existing.groupNum}: ` + `${existing.members}`; drawButton.disabled = true; return; } drawButton.disabled = false; } catch (error) { console.error(error); } } /************************************************* * GŁÓWNE LOSOWANIE *************************************************/ async function drawGroup() { const name = document.getElementById('name') .value .trim(); const chosenGroup = Number(select.value); /********************************************* * WALIDACJA LOGINU *********************************************/ if (!users.includes(name)) { resultDiv.textContent = 'Niepoprawny login. Wpisz jedno z: ' + users.join(', '); return; } /********************************************* * NIE MOŻNA WYBRAĆ SWOJEJ GRUPY *********************************************/ if (chosenGroup === userGroups[name]) { resultDiv.textContent = 'Nie możesz wybrać swojej własnej grupy!'; return; } /********************************************* * BLOKADA PRZYCISKU *********************************************/ drawButton.disabled = true; resultDiv.textContent = '⏳ Sprawdzam dostępność grupy...'; try { /***************************************** * TRANSAKCJA FIRESTORE * * Dzięki temu dwie osoby nie mogą * jednocześnie zająć tej samej grupy. *****************************************/ const result = await db.runTransaction(async transaction => { const userRef = db.collection('draws') .doc(drawDocumentId(name)); const groupRef = db.collection('groupLocks') .doc(groupDocumentId(chosenGroup)); const userDoc = await transaction.get(userRef); const groupDoc = await transaction.get(groupRef); /********************************* * UŻYTKOWNIK JUŻ LOSOWAŁ *********************************/ if (userDoc.exists) { throw new Error( 'USER_ALREADY_DREW' ); } /********************************* * GRUPA JUŻ ZAJĘTA *********************************/ if (groupDoc.exists) { throw new Error( 'GROUP_ALREADY_TAKEN' ); } const members = groups[chosenGroup].join(', '); const now = new Date().toISOString(); /********************************* * ZAPIS LOSOWANIA *********************************/ transaction.set(userRef, { year: CURRENT_YEAR, timestamp: now, user: name, groupNum: chosenGroup, members: members }); /********************************* * BLOKADA GRUPY *********************************/ transaction.set(groupRef, { year: CURRENT_YEAR, groupNum: chosenGroup, user: name, timestamp: now }); return { members: members }; }); /***************************************** * SUKCES *****************************************/ resultDiv.textContent = `🎉 Gratulacje ${name}! ` + `Wybrałeś Grupę ${chosenGroup}. ` + `Członkowie grupy: ${result.members}`; await updateAvailableGroups(); } catch (error) { console.error(error); if (error.message === 'USER_ALREADY_DREW') { const existing = await getUserDraw(name); if (existing) { resultDiv.textContent = `⚠️ ${name}, już dokonałeś wyboru. ` + `Wybrałeś Grupę ${existing.groupNum}: ` + `${existing.members}`; } } else if ( error.message === 'GROUP_ALREADY_TAKEN' ) { resultDiv.textContent = '⚠️ Ta grupa została właśnie ' + 'wybrana przez inną osobę. ' + 'Wybierz inną grupę.'; await updateAvailableGroups(); } else { resultDiv.textContent = '❌ Wystąpił błąd podczas zapisywania. ' + 'Sprawdź połączenie z Firebase.'; } } finally { drawButton.disabled = false; } } /************************************************* * PANEL ADMINISTRATORA *************************************************/ function showAdminPanel() { const password = prompt( 'Podaj hasło administratora:' ); if (password !== ADMIN_PASSWORD) { alert( 'Niepoprawne hasło' ); return; } const panel = document.getElementById( 'adminPanel' ); panel.style.display = 'block'; loadLogs(); } /************************************************* * WCZYTYWANIE LOGÓW *************************************************/ async function loadLogs() { const logsArea = document.getElementById('logs'); logsArea.value = '⏳ Ładowanie logów...'; try { const snapshot = await db .collection('draws') .where( 'year', '==', CURRENT_YEAR ) .get(); if (snapshot.empty) { logsArea.value = 'Brak losowań w 2026.'; return; } const logs = snapshot.docs .map(doc => doc.data()) .sort( (a, b) => a.timestamp.localeCompare( b.timestamp ) ); logsArea.value = logs.map(log => { return ( `${log.timestamp} - ` + `${log.user} wybrał Grupę ` + `${log.groupNum} ` + `(${log.members})` ); }).join('\n'); } catch (error) { console.error(error); logsArea.value = '❌ Nie udało się pobrać logów.\n\n' + error.message; } } /************************************************* * RESET LOSOWANIA 2026 *************************************************/ async function resetCurrentYear() { const confirmation = prompt( 'Aby potwierdzić RESET losowania 2026, ' + 'wpisz dokładnie: RESET' ); if (confirmation !== 'RESET') { alert( 'Reset anulowany.' ); return; } try { /***************************************** * USUWANIE LOSOWAŃ *****************************************/ const drawsSnapshot = await db .collection('draws') .where( 'year', '==', CURRENT_YEAR ) .get(); let batch = db.batch(); drawsSnapshot.docs.forEach(doc => { batch.delete(doc.ref); }); await batch.commit(); /***************************************** * USUWANIE BLOKAD GRUP *****************************************/ const groupsSnapshot = await db .collection('groupLocks') .where( 'year', '==', CURRENT_YEAR ) .get(); batch = db.batch(); groupsSnapshot.docs.forEach(doc => { batch.delete(doc.ref); }); await batch.commit(); /***************************************** * ODŚWIEŻENIE *****************************************/ document.getElementById('logs').value = 'Losowanie 2026 zostało zresetowane.'; resultDiv.textContent = '♻️ Losowanie 2026 zostało zresetowane. ' + 'Można rozpocząć od nowa.'; await updateAvailableGroups(); drawButton.disabled = false; alert( 'Losowanie 2026 zostało zresetowane.' ); } catch (error) { console.error(error); alert( '❌ Nie udało się wykonać resetu.\n\n' + error.message ); } } /************************************************* * PODWÓJNE KLIKNIĘCIE W TYTUŁ * OTWIERA PANEL ADMINA *************************************************/ document .querySelector('h1') .addEventListener( 'dblclick', showAdminPanel ); /************************************************* * ENTER W POLU IMIENIA *************************************************/ document .getElementById('name') .addEventListener( 'change', checkUserStatus ); /************************************************* * START *************************************************/ updateAvailableGroups(); /************************************************* * QR CODE *************************************************/ const url = window.location.href; new QRCode( document.getElementById('qrcode'), { text: url, width: 128, height: 128 } ); </script> </body> </html>
