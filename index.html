<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Świąteczny Los 🎄</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: url('https://i.ibb.co/tBf5G6/christmas-bg.jpg')
                no-repeat center center fixed;
            background-size: cover;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;

            background: rgba(255, 255, 255, 0.94);

            padding: 30px;
            border-radius: 20px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #b30000;
            cursor: pointer;
        }

        h2 {
            color: #333;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;
            padding: 14px;

            margin-top: 10px;
            margin-bottom: 20px;

            border: 2px solid #ddd;
            border-radius: 10px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #b30000;
        }

        .groups {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;

            margin-top: 20px;
        }

        .group-button {
            padding: 18px 5px;

            border: none;
            border-radius: 12px;

            background: #b30000;
            color: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .group-button:hover:not(:disabled) {
            transform: scale(1.05);
            background: #8f0000;
        }

        .group-button:disabled {
            background: #aaa;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #result {
            margin-top: 25px;
            padding: 20px;

            border-radius: 15px;

            background: #f5f5f5;

            font-size: 18px;
            font-weight: bold;
        }

        #available {
            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.8);

            color: #333;
            font-size: 14px;
        }

        #adminPanel {
            display: none;

            margin-top: 30px;
            padding: 20px;

            background: #f0f0f0;

            border-radius: 15px;
        }

        #adminLogs {
            margin-top: 20px;

            text-align: left;

            max-height: 400px;
            overflow-y: auto;
        }

        .log {
            padding: 10px;
            margin-bottom: 8px;

            background: white;

            border-radius: 8px;

            font-size: 14px;
        }

        .admin-button {
            padding: 12px 20px;

            margin: 5px;

            border: none;
            border-radius: 8px;

            background: #333;
            color: white;

            cursor: pointer;
        }

        .admin-button:hover {
            background: #111;
        }

        #qrCode {
            margin-top: 25px;

            display: flex;
            justify-content: center;
        }

        .warning {
            color: #b30000;
            font-weight: bold;
        }

        @media (max-width: 500px) {

            .container {
                padding: 20px;
            }

            .groups {
                grid-template-columns: repeat(5, 1fr);
                gap: 5px;
            }

            .group-button {
                padding: 15px 3px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1 id="title">🎄 Świąteczny Los 🎁</h1>

    <p>
        Wpisz swoje imię, a następnie wybierz jedną z dostępnych grup.
    </p>

    <input
        type="text"
        id="nameInput"
        placeholder="Wpisz swoje imię..."
        autocomplete="off"
    >

    <div id="available">
        Sprawdzanie dostępności...
    </div>

    <h2>Wybierz grupę</h2>

    <p>
        Wybierz A, B, C, D lub E.
    </p>

    <div class="groups">

        <button class="group-button" data-group="1">
            A
        </button>

        <button class="group-button" data-group="2">
            B
        </button>

        <button class="group-button" data-group="3">
            C
        </button>

        <button class="group-button" data-group="4">
            D
        </button>

        <button class="group-button" data-group="5">
            E
        </button>

    </div>

    <div id="result"></div>

    <div id="qrCode"></div>

    <!-- PANEL ADMINISTRATORA -->

    <div id="adminPanel">

        <h2>🔐 Panel administratora</h2>

        <button
            class="admin-button"
            id="loadLogs"
        >
            Pokaż wyniki
        </button>

        <button
            class="admin-button"
            id="resetData"
        >
            Resetuj losowanie 2026
        </button>

        <div id="adminLogs"></div>

    </div>

</div>


<script>

    // =========================================================
    // FIREBASE
    // =========================================================

    const firebaseConfig = {
        apiKey: "AIzaSyCsLwn69mSEbZNJOnaEKxZMEBGc_9nF3j4",
        authDomain: "swiateczny-los.firebaseapp.com",
        projectId: "swiateczny-los",
        storageBucket: "swiateczny-los.firebasestorage.app",
        messagingSenderId: "106728824953",
        appId: "1:106728824953:web:0b317e165afecc3fb734a8"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();


    // =========================================================
    // USTAWIENIA
    // =========================================================

    const CURRENT_YEAR = 2026;

    const ADMIN_PASSWORD = "Visiativ17";


    // Użytkownicy, którzy mogą losować

    const users = [
        "Kasia",
        "Jarek",
        "Sabina",
        "Anna",
        "Magda"
    ];


    // Grupa przypisana do każdego użytkownika

    const userGroups = {
        "Kasia": 3,
        "Jarek": 5,
        "Sabina": 4,
        "Anna": 1,
        "Magda": 2
    };


    // =========================================================
    // ELEMENTY STRONY
    // =========================================================

    const nameInput =
        document.getElementById("nameInput");

    const availableDiv =
        document.getElementById("available");

    const resultDiv =
        document.getElementById("result");

    const qrCodeDiv =
        document.getElementById("qrCode");

    const adminPanel =
        document.getElementById("adminPanel");

    const adminLogs =
        document.getElementById("adminLogs");

    const groupButtons =
        document.querySelectorAll(".group-button");


    // =========================================================
    // SPRAWDZENIE, KTO JUŻ LOSOWAŁ
    // =========================================================

    async function updateAvailableUsers() {

        try {

            const snapshot =
                await db
                    .collection("draws")
                    .where(
                        "year",
                        "==",
                        CURRENT_YEAR
                    )
                    .get();


            const drawnUsers =
                snapshot.docs.map(
                    doc => doc.data().user
                );


            const availableUsers =
                users.filter(
                    user =>
                        !drawnUsers.includes(user)
                );


            if (availableUsers.length > 0) {

                availableDiv.textContent =
                    "Dostępni do losowania: " +
                    availableUsers.join(", ");

            } else {

                availableDiv.textContent =
                    "🎉 Wszyscy już dokonali losowania!";

            }

        } catch (error) {

            console.error(error);

            availableDiv.textContent =
                "⚠️ Problem z połączeniem z bazą danych.";

        }

    }


    // =========================================================
    // AKTUALIZACJA PRZYCISKÓW GRUP
    // =========================================================

    async function updateGroupButtons() {

        try {

            const snapshot =
                await db
                    .collection("groupLocks")
                    .where(
                        "year",
                        "==",
                        CURRENT_YEAR
                    )
                    .get();


            const takenGroups =
                snapshot.docs.map(
                    doc => doc.data().group
                );


            const selectedName =
                nameInput.value.trim();


            const ownGroup =
                userGroups[selectedName];


            groupButtons.forEach(button => {

                const group =
                    Number(
                        button.dataset.group
                    );


                // =================================================
                // WAŻNE:
                //
                // NIE pokazujemy użytkownikowi,
                // kto znajduje się w grupie.
                //
                // Przycisk jest po prostu niedostępny.
                // =================================================

                if (takenGroups.includes(group)) {

                    button.disabled = true;

                } else if (
                    selectedName &&
                    ownGroup === group
                ) {

                    // Własnej grupy również nie można wybrać,
                    // ale użytkownik nie dostaje informacji,
                    // DLACZEGO.

                    button.disabled = true;

                } else {

                    button.disabled = false;

                }

            });

        } catch (error) {

            console.error(
                "Błąd aktualizacji grup:",
                error
            );

        }

    }


    // =========================================================
    // AKTUALIZACJA WSZYSTKIEGO
    // =========================================================

    async function updateEverything() {

        await updateGroupButtons();

        await updateAvailableUsers();

    }


    // =========================================================
    // ZMIANA IMIENIA
    // =========================================================

    nameInput.addEventListener(
        "input",
        async function() {

            resultDiv.textContent = "";

            qrCodeDiv.innerHTML = "";

            await updateGroupButtons();

        }
    );


    // =========================================================
    // LOSOWANIE
    // =========================================================

    groupButtons.forEach(button => {

        button.addEventListener(
            "click",
            async function() {

                const selectedName =
                    nameInput.value.trim();

                const selectedGroup =
                    Number(
                        this.dataset.group
                    );


                // -------------------------------------------------
                // Sprawdzenie imienia
                // -------------------------------------------------

                if (!selectedName) {

                    resultDiv.innerHTML =
                        '<span class="warning">' +
                        'Najpierw wpisz swoje imię.' +
                        '</span>';

                    return;

                }


                // -------------------------------------------------
                // Sprawdzenie czy użytkownik jest na liście
                // -------------------------------------------------

                if (!users.includes(selectedName)) {

                    resultDiv.innerHTML =
                        '<span class="warning">' +
                        'Nie znaleziono tego imienia.' +
                        '</span>';

                    return;

                }


                resultDiv.textContent =
                    "⏳ Losowanie...";


                try {

                    // =================================================
                    // TRANSAKCJA FIRESTORE
                    // =================================================

                    await db.runTransaction(
                        async transaction => {

                            const drawRef =
                                db
                                    .collection("draws")
                                    .doc(
                                        CURRENT_YEAR +
                                        "_" +
                                        selectedName
                                    );


                            const groupLockRef =
                                db
                                    .collection("groupLocks")
                                    .doc(
                                        CURRENT_YEAR +
                                        "_" +
                                        selectedGroup
                                    );


                            const drawDoc =
                                await transaction.get(
                                    drawRef
                                );


                            const groupDoc =
                                await transaction.get(
                                    groupLockRef
                                );


                            // -----------------------------------------
                            // Użytkownik już losował
                            // -----------------------------------------

                            if (drawDoc.exists) {

                                throw new Error(
                                    "ALREADY_DRAWN"
                                );

                            }


                            // -----------------------------------------
                            // Grupa jest już zajęta
                            // -----------------------------------------

                            if (groupDoc.exists) {

                                throw new Error(
                                    "GROUP_TAKEN"
                                );

                            }


                            // -----------------------------------------
                            // Własna grupa
                            // -----------------------------------------

                            if (
                                userGroups[selectedName] ===
                                selectedGroup
                            ) {

                                throw new Error(
                                    "OWN_GROUP"
                                );

                            }


                            // -----------------------------------------
                            // Zapis losowania
                            // -----------------------------------------

                            transaction.set(
                                drawRef,
                                {
                                    year: CURRENT_YEAR,
                                    user: selectedName,
                                    group: selectedGroup,
                                    timestamp:
                                        firebase.firestore.FieldValue
                                            .serverTimestamp()
                                }
                            );


                            // -----------------------------------------
                            // Blokada grupy
                            //
                            // UWAGA:
                            // ta informacja jest potrzebna
                            // technicznie, ale użytkownikowi
                            // nie pokazujemy, kto ją zajął.
                            // -----------------------------------------

                            transaction.set(
                                groupLockRef,
                                {
                                    year: CURRENT_YEAR,
                                    group: selectedGroup,
                                    timestamp:
                                        firebase.firestore.FieldValue
                                            .serverTimestamp()
                                }
                            );

                        }
                    );


                    // =================================================
                    // SUKCES
                    // =================================================

                    resultDiv.innerHTML =
                        "🎉 Losowanie zakończone!<br><br>" +
                        "Wybrałeś grupę <strong>" +
                        String.fromCharCode(
                            64 + selectedGroup
                        ) +
                        "</strong>.";


                    // -------------------------------------------------
                    // QR CODE
                    // -------------------------------------------------

                    qrCodeDiv.innerHTML = "";

                    new QRCode(
                        qrCodeDiv,
                        {
                            text: window.location.href,
                            width: 150,
                            height: 150
                        }
                    );


                    // -------------------------------------------------
                    // Odświeżenie strony
                    // -------------------------------------------------

                    await updateEverything();


                } catch (error) {

                    console.error(error);


                    // =================================================
                    // WAŻNE:
                    //
                    // Nie ujawniamy żadnych szczegółów,
                    // kto zajął grupę.
                    // =================================================

                    if (
                        error.message ===
                        "ALREADY_DRAWN"
                    ) {

                        resultDiv.innerHTML =
                            '<span class="warning">' +
                            "To imię ma już wykonane losowanie." +
                            "</span>";

                    } else if (
                        error.message ===
                        "GROUP_TAKEN"
                    ) {

                        resultDiv.innerHTML =
                            '<span class="warning">' +
                            "Ta opcja jest już niedostępna. " +
                            "Wybierz inną." +
                            "</span>";


                        await updateGroupButtons();

                    } else if (
                        error.message ===
                        "OWN_GROUP"
                    ) {

                        // Celowo neutralny komunikat.
                        // Nie informujemy, kto jest w tej grupie.

                        resultDiv.innerHTML =
                            '<span class="warning">' +
                            "Tej opcji nie można wybrać. " +
                            "Wybierz inną." +
                            "</span>";

                    } else {

                        resultDiv.innerHTML =
                            '<span class="warning">' +
                            "Wystąpił problem. " +
                            "Spróbuj ponownie." +
                            "</span>";

                    }

                }

            }
        );

    });


    // =========================================================
    // REAL-TIME UPDATE
    // =========================================================

    function setupRealtimeUpdates() {


        // ---------------------------------------------------------
        // Aktualizacja listy osób, które jeszcze nie głosowały
        // ---------------------------------------------------------

        db
            .collection("draws")
            .where(
                "year",
                "==",
                CURRENT_YEAR
            )
            .onSnapshot(
                snapshot => {

                    const drawnUsers =
                        snapshot.docs.map(
                            doc => doc.data().user
                        );


                    const availableUsers =
                        users.filter(
                            user =>
                                !drawnUsers.includes(user)
                        );


                    if (
                        availableUsers.length > 0
                    ) {

                        availableDiv.textContent =
                            "Dostępni do losowania: " +
                            availableUsers.join(", ");

                    } else {

                        availableDiv.textContent =
                            "🎉 Wszyscy już dokonali losowania!";

                    }

                },

                error => {

                    console.error(
                        "Błąd nasłuchiwania draws:",
                        error
                    );

                    availableDiv.textContent =
                        "⚠️ Problem z aktualizacją listy.";

                }
            );


        // ---------------------------------------------------------
        // Aktualizacja zajętych grup
        // ---------------------------------------------------------

        db
            .collection("groupLocks")
            .where(
                "year",
                "==",
                CURRENT_YEAR
            )
            .onSnapshot(
                () => {

                    updateGroupButtons();

                },

                error => {

                    console.error(
                        "Błąd nasłuchiwania grup:",
                        error
                    );

                }
            );

    }


    // =========================================================
    // PANEL ADMINISTRATORA
    // =========================================================

    document
        .getElementById("title")
        .addEventListener(
            "dblclick",
            function() {

                const password =
                    prompt(
                        "Podaj hasło administratora:"
                    );


                if (
                    password ===
                    ADMIN_PASSWORD
                ) {

                    adminPanel.style.display =
                        "block";

                } else if (
                    password !== null
                ) {

                    alert(
                        "Nieprawidłowe hasło."
                    );

                }

            }
        );


    // =========================================================
    // LOGI ADMINISTRATORA
    // =========================================================

    document
        .getElementById("loadLogs")
        .addEventListener(
            "click",
            async function() {

                adminLogs.innerHTML =
                    "⏳ Ładowanie...";


                try {

                    const snapshot =
                        await db
                            .collection("draws")
                            .where(
                                "year",
                                "==",
                                CURRENT_YEAR
                            )
                            .get();


                    adminLogs.innerHTML = "";


                    if (
                        snapshot.empty
                    ) {

                        adminLogs.innerHTML =
                            "<p>Brak wykonanych losowań.</p>";

                        return;

                    }


                    snapshot.docs.forEach(
                        doc => {

                            const data =
                                doc.data();


                            const groupLetter =
                                String.fromCharCode(
                                    64 + data.group
                                );


                            const div =
                                document.createElement(
                                    "div"
                                );


                            div.className =
                                "log";


                            div.innerHTML =
                                "<strong>" +
                                data.user +
                                "</strong>" +
                                " → grupa " +
                                "<strong>" +
                                groupLetter +
                                "</strong>";


                            adminLogs.appendChild(
                                div
                            );

                        }
                    );


                } catch (error) {

                    console.error(error);

                    adminLogs.innerHTML =
                        "⚠️ Nie udało się pobrać danych.";

                }

            }
        );


    // =========================================================
    // RESET
    // =========================================================

    document
        .getElementById("resetData")
        .addEventListener(
            "click",
            async function() {

                const confirmation =
                    prompt(
                        'Aby zresetować losowanie 2026, wpisz: RESET'
                    );


                if (
                    confirmation !==
                    "RESET"
                ) {

                    return;

                }


                try {

                    // ---------------------------------------------
                    // Usuwanie losowań
                    // ---------------------------------------------

                    const drawsSnapshot =
                        await db
                            .collection("draws")
                            .where(
                                "year",
                                "==",
                                CURRENT_YEAR
                            )
                            .get();


                    const batch =
                        db.batch();


                    drawsSnapshot.docs.forEach(
                        doc => {

                            batch.delete(
                                doc.ref
                            );

                        }
                    );


                    // ---------------------------------------------
                    // Usuwanie blokad grup
                    // ---------------------------------------------

                    const groupsSnapshot =
                        await db
                            .collection("groupLocks")
                            .where(
                                "year",
                                "==",
                                CURRENT_YEAR
                            )
                            .get();


                    groupsSnapshot.docs.forEach(
                        doc => {

                            batch.delete(
                                doc.ref
                            );

                        }
                    );


                    await batch.commit();


                    alert(
                        "Losowanie 2026 zostało zresetowane."
                    );


                    adminLogs.innerHTML = "";


                    await updateEverything();


                } catch (error) {

                    console.error(error);

                    alert(
                        "Wystąpił błąd podczas resetowania."
                    );

                }

            }
        );


    // =========================================================
    // START
    // =========================================================

    updateEverything();

    setupRealtimeUpdates();

</script>

</body>
</html>
