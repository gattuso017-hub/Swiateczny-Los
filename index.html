<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Świąteczny Los 🎄</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: url('https://i.ibb.co/tBf5G6/christmas-bg.jpg')
                no-repeat center center fixed;

            background-size: cover;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;

            background: rgba(255, 255, 255, 0.94);

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        h1 {
            margin-top: 0;

            color: #b30000;

            cursor: pointer;
        }

        h2 {
            color: #333;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-top: 10px;
            margin-bottom: 20px;

            border: 2px solid #ddd;

            border-radius: 10px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #b30000;
        }

        .groups {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 10px;

            margin-top: 20px;
        }

        .group-button {
            padding: 18px 5px;

            border: none;

            border-radius: 12px;

            background: #b30000;

            color: white;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .group-button:hover:not(:disabled) {
            transform: scale(1.05);

            background: #8f0000;
        }

        /*
         * GRUPA JUŻ WYKORZYSTANA
         *
         * Ważne:
         *
         * Nie pokazujemy, KTO ją wykorzystał.
         */

        .group-button:disabled {
            background: #aaa;

            color: #eee;

            cursor: not-allowed;

            opacity: 0.7;

            transform: none;
        }

        #result {
            margin-top: 25px;

            padding: 20px;

            border-radius: 15px;

            background: #f5f5f5;

            font-size: 18px;

            font-weight: bold;

            line-height: 1.5;
        }

        #available {
            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.8);

            color: #333;

            font-size: 15px;
        }

        .available-names {
            color: #b30000;
            font-weight: bold;
        }

        #adminPanel {
            display: none;

            margin-top: 30px;

            padding: 20px;

            background: #f0f0f0;

            border-radius: 15px;
        }

        #adminLogs {
            margin-top: 20px;

            text-align: left;

            max-height: 500px;

            overflow-y: auto;
        }

        .log {
            padding: 14px;

            margin-bottom: 10px;

            background: white;

            border-radius: 10px;

            font-size: 14px;

            line-height: 1.5;
        }

        .log strong {
            color: #b30000;
        }

        .admin-button {
            padding: 12px 20px;

            margin: 5px;

            border: none;

            border-radius: 8px;

            background: #333;

            color: white;

            cursor: pointer;
        }

        .admin-button:hover {
            background: #111;
        }

        #qrCode {
            margin-top: 25px;

            display: flex;

            justify-content: center;
        }

        .warning {
            color: #b30000;

            font-weight: bold;
        }

        .success {
            color: #168a2f;

            font-weight: bold;
        }

        .winner {
            margin-top: 10px;

            font-size: 24px;

            color: #b30000;
        }

        @media (max-width: 500px) {

            .container {
                padding: 20px;
            }

            .groups {
                gap: 5px;
            }

            .group-button {
                padding: 15px 3px;

                font-size: 17px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <h1 id="title">
        🎄 Świąteczny Los 🎁
    </h1>


    <p>
        Wpisz swoje imię, a następnie wybierz jedną z dostępnych grup.
    </p>


    <input
        type="text"
        id="nameInput"
        placeholder="Wpisz swoje imię..."
        autocomplete="off"
    >


    <div id="available">
        Sprawdzanie dostępności...
    </div>


    <h2>
        Wybierz grupę
    </h2>


    <p>
        Wybierz A, B, C, D lub E.
    </p>


    <div class="groups">

        <button
            class="group-button"
            data-group="1"
        >
            A
        </button>

        <button
            class="group-button"
            data-group="2"
        >
            B
        </button>

        <button
            class="group-button"
            data-group="3"
        >
            C
        </button>

        <button
            class="group-button"
            data-group="4"
        >
            D
        </button>

        <button
            class="group-button"
            data-group="5"
        >
            E
        </button>

    </div>


    <div id="result"></div>


    <div id="qrCode"></div>


    <!-- PANEL ADMINISTRATORA -->

    <div id="adminPanel">

        <h2>
            🔐 Panel administratora
        </h2>


        <button
            class="admin-button"
            id="loadLogs"
        >
            Pokaż wyniki
        </button>


        <button
            class="admin-button"
            id="resetData"
        >
            Resetuj losowanie 2026
        </button>


        <div id="adminLogs"></div>

    </div>

</div>


<script>


// ============================================================
// FIREBASE
// ============================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyCsLwn69mSEbZNJOnaEKxZMEBGc_9nF3j4",

    authDomain:
        "swiateczny-los.firebaseapp.com",

    projectId:
        "swiateczny-los",

    storageBucket:
        "swiateczny-los.firebasestorage.app",

    messagingSenderId:
        "106728824953",

    appId:
        "1:106728824953:web:0b317e165afecc3fb734a8"

};


firebase.initializeApp(firebaseConfig);


const db =
    firebase.firestore();


// ============================================================
// USTAWIENIA
// ============================================================

const CURRENT_YEAR = 2026;

const ADMIN_PASSWORD =
    "Visiativ17";


// ============================================================
// GRUPY
// ============================================================

const groups = {

    1: [
        "Madzia",
        "Kazek",
        "Ania",
        "Mikołaj"
    ],

    2: [
        "Anna",
        "Jan"
    ],

    3: [
        
        "Sabina",
        "Artur",
        "Wiktoria"
    ],

    4: [
        "Madzia",
        "Jarek",
        "Krzyś"
    ],

    5: [
        "Kasia",
        "Kamil",
        "Franuś"
    ]

};


// ============================================================
// OSOBY, KTÓRE GŁOSUJĄ
// ============================================================

const users = [

    "Kasia",
    "Jarek",
    "Sabina",
    "Anna",
    "Magda"

];


// ============================================================
// WŁASNE GRUPY
// ============================================================

const userGroups = {

    "Kasia": 3,

    "Jarek": 5,

    "Sabina": 4,

    "Anna": 1,

    "Magda": 2

};


// ============================================================
// ELEMENTY
// ============================================================

const nameInput =
    document.getElementById(
        "nameInput"
    );


const availableDiv =
    document.getElementById(
        "available"
    );


const resultDiv =
    document.getElementById(
        "result"
    );


const qrCodeDiv =
    document.getElementById(
        "qrCode"
    );


const adminPanel =
    document.getElementById(
        "adminPanel"
    );


const adminLogs =
    document.getElementById(
        "adminLogs"
    );


const groupButtons =
    document.querySelectorAll(
        ".group-button"
    );


// ============================================================
// NUMER GRUPY → LITERA
// ============================================================

function groupLetter(groupNumber) {

    return String.fromCharCode(
        64 + Number(groupNumber)
    );

}


// ============================================================
// BEZPIECZNE HTML
// ============================================================

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


// ============================================================
// LISTA OSÓB, KTÓRE JESZCZE NIE LOSOWAŁY
// ============================================================

async function updateAvailableUsers() {

    try {

        const snapshot =
            await db
                .collection("draws")
                .where(
                    "year",
                    "==",
                    CURRENT_YEAR
                )
                .get();


        const drawnUsers =
            snapshot.docs.map(
                doc =>
                    doc.data().user
            );


        const availableUsers =
            users.filter(
                user =>
                    !drawnUsers.includes(
                        user
                    )
            );


        if (
            availableUsers.length > 0
        ) {

            availableDiv.innerHTML =
                "Dostępni do losowania: " +
                '<strong class="available-names">' +
                escapeHtml(availableUsers.join(", ")) +
                "</strong>";

        } else {

            availableDiv.textContent =
                "🎉 Wszyscy już dokonali losowania!";

        }

    } catch (error) {

        console.error(error);

        availableDiv.textContent =
            "⚠️ Problem z połączeniem z bazą danych.";

    }

}


// ============================================================
// AKTUALIZACJA GRUP
// ============================================================
//
// Tutaj jest bardzo ważna zasada:
//
// PRZED ODDANIEM GŁOSU nie pokazujemy,
// która grupa należy do danej osoby.
//
// ALE grupy już wykorzystane przez innych
// pokazujemy jako wyszarzone.
//
// Nie pokazujemy, KTO je wykorzystał.
// ============================================================

async function updateGroupButtons() {

    try {

        const snapshot =
            await db
                .collection("groupLocks")
                .where(
                    "year",
                    "==",
                    CURRENT_YEAR
                )
                .get();


        const takenGroups =
            snapshot.docs.map(
                doc =>
                    Number(
                        doc.data().group
                    )
            );


        groupButtons.forEach(
            button => {

                const group =
                    Number(
                        button.dataset.group
                    );


                if (
                    takenGroups.includes(
                        group
                    )
                ) {

                    button.disabled =
                        true;

                    button.title =
                        "Ta grupa została już wykorzystana.";

                } else {

                    button.disabled =
                        false;

                    button.title =
                        "";

                }

            }
        );


    } catch (error) {

        console.error(
            "Błąd aktualizacji grup:",
            error
        );

    }

}


// ============================================================
// AKTUALIZACJA WSZYSTKIEGO
// ============================================================

async function updateEverything() {

    await updateGroupButtons();

    await updateAvailableUsers();

}


// ============================================================
// ZMIANA IMIENIA
// ============================================================

nameInput.addEventListener(
    "input",
    function() {

        resultDiv.innerHTML = "";

        qrCodeDiv.innerHTML = "";

        /*
         * WAŻNE:
         *
         * Wpisanie Jarek/Kasia/Sabina itd.
         * NIE powoduje wyszarzenia ich własnej grupy.
         *
         * Aktualizujemy tylko informację o tym,
         * które grupy zostały już wykorzystane.
         */

        updateGroupButtons();

    }
);


// ============================================================
// LOSOWANIE
// ============================================================

groupButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            async function() {

                const selectedName =
                    nameInput.value.trim();


                const selectedGroup =
                    Number(
                        this.dataset.group
                    );


                // ------------------------------------------------
                // BRAK IMIENIA
                // ------------------------------------------------

                if (!selectedName) {

                    resultDiv.innerHTML =
                        '<span class="warning">' +
                        "Najpierw wpisz swoje imię." +
                        "</span>";

                    return;

                }


                // ------------------------------------------------
                // NIEZNANE IMIĘ
                // ------------------------------------------------

                if (
                    !users.includes(
                        selectedName
                    )
                ) {

                    resultDiv.innerHTML =
                        '<span class="warning">' +
                        "Nie znaleziono tego imienia." +
                        "</span>";

                    return;

                }


                resultDiv.textContent =
                    "⏳ Losowanie...";


                try {


                    // =================================================
                    // TRANSAKCJA
                    // =================================================

                    await db.runTransaction(
                        async transaction => {


                            const drawRef =
                                db
                                    .collection(
                                        "draws"
                                    )
                                    .doc(
                                        CURRENT_YEAR +
                                        "_" +
                                        selectedName
                                    );


                            const groupLockRef =
                                db
                                    .collection(
                                        "groupLocks"
                                    )
                                    .doc(
                                        CURRENT_YEAR +
                                        "_" +
                                        selectedGroup
                                    );


                            const drawDoc =
                                await transaction.get(
                                    drawRef
                                );


                            const groupDoc =
                                await transaction.get(
                                    groupLockRef
                                );


                            // -----------------------------------------
                            // OSOBA JUŻ LOSOWAŁA
                            // -----------------------------------------

                            if (
                                drawDoc.exists
                            ) {

                                throw new Error(
                                    "ALREADY_DRAWN"
                                );

                            }


                            // -----------------------------------------
                            // GRUPA JUŻ ZAJĘTA
                            // -----------------------------------------

                            if (
                                groupDoc.exists
                            ) {

                                throw new Error(
                                    "GROUP_TAKEN"
                                );

                            }


                            // -----------------------------------------
                            // WŁASNA GRUPA
                            //
                            // NIE JEST WYSZARZANA.
                            // SPRAWDZAMY DOPIERO PO KLIKNIĘCIU.
                            // -----------------------------------------

                            if (
                                userGroups[
                                    selectedName
                                ] ===
                                selectedGroup
                            ) {

                                throw new Error(
                                    "OWN_GROUP"
                                );

                            }


                            // -----------------------------------------
                            // OSOBY W WYBRANEJ GRUPIE
                            // -----------------------------------------

                            const selectedMembers =
                                groups[
                                    selectedGroup
                                ] || [];


                            // -----------------------------------------
                            // ZAPIS WYNIKU
                            //
                            // winnerMembers = osoby,
                            // które użytkownik zobaczy po losowaniu.
                            // -----------------------------------------

                            transaction.set(
                                drawRef,
                                {

                                    year:
                                        CURRENT_YEAR,

                                    user:
                                        selectedName,

                                    group:
                                        selectedGroup,

                                    winnerMembers:
                                        selectedMembers,

                                    timestamp:
                                        firebase
                                            .firestore
                                            .FieldValue
                                            .serverTimestamp()

                                }
                            );


                            // -----------------------------------------
                            // BLOKADA GRUPY
                            // -----------------------------------------

                            transaction.set(
                                groupLockRef,
                                {

                                    year:
                                        CURRENT_YEAR,

                                    group:
                                        selectedGroup,

                                    timestamp:
                                        firebase
                                            .firestore
                                            .FieldValue
                                            .serverTimestamp()

                                }
                            );

                        }
                    );


                    // =================================================
                    // POKAZANIE WYNIKU UŻYTKOWNIKOWI
                    // =================================================

                    const winnerMembers =
                        groups[
                            selectedGroup
                        ] || [];


                    resultDiv.innerHTML =

                        '<span class="success">' +

                        "🎉 Losowanie zakończone!" +

                        "</span>" +

                        '<div class="winner">' +

                        "Twoja grupa: " +

                        groupLetter(
                            selectedGroup
                        ) +

                        "</div>" +

                        "<br>" +

                        "👥 Wylosowana grupa:" +

                        "<br><br>" +

                        "<strong>" +

                        escapeHtml(
                            winnerMembers.join(", ")
                        ) +

                        "</strong>";


                    // =================================================
                    // QR CODE
                    // =================================================

                    qrCodeDiv.innerHTML = "";


                    new QRCode(
                        qrCodeDiv,
                        {

                            text:
                                window.location.href,

                            width:
                                150,

                            height:
                                150

                        }
                    );


                    // =================================================
                    // AKTUALIZACJA
                    // =================================================

                    await updateEverything();


                } catch (error) {

                    console.error(
                        error
                    );


                    // ----------------------------------------------
                    // JUŻ LOSOWAŁ
                    // ----------------------------------------------

                    if (
                        error.message ===
                        "ALREADY_DRAWN"
                    ) {

                        resultDiv.innerHTML =
                            '<span class="warning">' +

                            "To imię ma już wykonane losowanie." +

                            "</span>";

                    }


                    // ----------------------------------------------
                    // GRUPA ZAJĘTA
                    // ----------------------------------------------

                    else if (
                        error.message ===
                        "GROUP_TAKEN"
                    ) {

                        resultDiv.innerHTML =
                            '<span class="warning">' +

                            "Ta opcja jest już niedostępna. " +

                            "Wybierz inną." +

                            "</span>";


                        await updateGroupButtons();

                    }


                    // ----------------------------------------------
                    // WŁASNA GRUPA
                    // ----------------------------------------------

                    else if (
                        error.message ===
                        "OWN_GROUP"
                    ) {

                        /*
                         * Nie mówimy:
                         *
                         * "To Twoja grupa".
                         *
                         * Bo zdradziłoby to informację.
                         */

                        resultDiv.innerHTML =
                            '<span class="warning">' +

                            "Ta opcja jest niedostępna. " +

                            "Wybierz inną." +

                            "</span>";

                    }


                    // ----------------------------------------------
                    // INNY BŁĄD
                    // ----------------------------------------------

                    else {

                        resultDiv.innerHTML =
                            '<span class="warning">' +

                            "Wystąpił problem. Spróbuj ponownie." +

                            "</span>";

                    }

                }

            }
        );

    }
);


// ============================================================
// REAL-TIME
// ============================================================

function setupRealtimeUpdates() {


    // ----------------------------------------------------------
    // Aktualizacja listy osób
    // ----------------------------------------------------------

    db
        .collection("draws")
        .where(
            "year",
            "==",
            CURRENT_YEAR
        )
        .onSnapshot(

            snapshot => {

                const drawnUsers =
                    snapshot.docs.map(
                        doc =>
                            doc.data().user
                    );


                const availableUsers =
                    users.filter(
                        user =>
                            !drawnUsers.includes(
                                user
                            )
                    );


                if (
                    availableUsers.length > 0
                ) {

                    availableDiv.innerHTML =
    "Dostępni do losowania: " +
    '<strong class="available-names">' +
    escapeHtml(availableUsers.join(", ")) +
    "</strong>";

                } else {

                    availableDiv.textContent =
                        "🎉 Wszyscy już dokonali losowania!";

                }

            },

            error => {

                console.error(
                    "Błąd nasłuchiwania draws:",
                    error
                );

            }

        );


    // ----------------------------------------------------------
    // Aktualizacja zajętych grup
    // ----------------------------------------------------------

    db
        .collection("groupLocks")
        .where(
            "year",
            "==",
            CURRENT_YEAR
        )
        .onSnapshot(

            () => {

                updateGroupButtons();

            },

            error => {

                console.error(
                    "Błąd nasłuchiwania grup:",
                    error
                );

            }

        );

}


// ============================================================
// PANEL ADMINISTRATORA
// ============================================================

document
    .getElementById("title")
    .addEventListener(
        "dblclick",
        function() {


            const password =
                prompt(
                    "Podaj hasło administratora:"
                );


            if (
                password ===
                ADMIN_PASSWORD
            ) {

                adminPanel.style.display =
                    "block";

            }

            else if (
                password !== null
            ) {

                alert(
                    "Nieprawidłowe hasło."
                );

            }

        }
    );


// ============================================================
// LOGI ADMINISTRATORA
// ============================================================

document
    .getElementById("loadLogs")
    .addEventListener(
        "click",
        async function() {


            adminLogs.innerHTML =
                "⏳ Ładowanie wyników...";


            try {


                const snapshot =
                    await db
                        .collection(
                            "draws"
                        )
                        .where(
                            "year",
                            "==",
                            CURRENT_YEAR
                        )
                        .get();


                adminLogs.innerHTML = "";


                if (
                    snapshot.empty
                ) {

                    adminLogs.innerHTML =
                        "<p>" +
                        "Brak wykonanych losowań." +
                        "</p>";

                    return;

                }


                // ------------------------------------------------
                // SORTOWANIE
                // ------------------------------------------------

                const results =
                    snapshot.docs
                        .map(
                            doc =>
                                doc.data()
                        )
                        .sort(
                            (a, b) =>
                                a.user.localeCompare(
                                    b.user,
                                    "pl"
                                )
                        );


                // ------------------------------------------------
                // WYNIKI
                // ------------------------------------------------

                results.forEach(
                    data => {


                        const groupNumber =
                            Number(
                                data.group
                            );


                        const letter =
                            groupLetter(
                                groupNumber
                            );


                        const members =
                            groups[
                                groupNumber
                            ] || [];


                        const div =
                            document.createElement(
                                "div"
                            );


                        div.className =
                            "log";


                        div.innerHTML =

                            "👤 " +

                            "<strong>" +

                            escapeHtml(
                                data.user
                            ) +

                            "</strong>" +

                            "<br>" +

                            "🎯 Wybrana grupa: " +

                            "<strong>" +

                            letter +

                            "</strong>" +

                            "<br>" +

                            "👥 Osoby w grupie: " +

                            escapeHtml(
                                members.join(", ")
                            );


                        adminLogs.appendChild(
                            div
                        );

                    }
                );


            } catch (error) {

                console.error(
                    error
                );


                adminLogs.innerHTML =
                    "⚠️ Nie udało się pobrać wyników.";

            }

        }
    );


// ============================================================
// RESET
// ============================================================

document
    .getElementById("resetData")
    .addEventListener(
        "click",
        async function() {


            const confirmation =
                prompt(
                    "Aby zresetować losowanie 2026, wpisz: RESET"
                );


            if (
                confirmation !==
                "RESET"
            ) {

                return;

            }


            try {


                // ------------------------------------------------
                // LOSOWANIA
                // ------------------------------------------------

                const drawsSnapshot =
                    await db
                        .collection(
                            "draws"
                        )
                        .where(
                            "year",
                            "==",
                            CURRENT_YEAR
                        )
                        .get();


                // ------------------------------------------------
                // BLOKADY
                // ------------------------------------------------

                const groupsSnapshot =
                    await db
                        .collection(
                            "groupLocks"
                        )
                        .where(
                            "year",
                            "==",
                            CURRENT_YEAR
                        )
                        .get();


                const batch =
                    db.batch();


                drawsSnapshot.docs.forEach(
                    doc => {

                        batch.delete(
                            doc.ref
                        );

                    }
                );


                groupsSnapshot.docs.forEach(
                    doc => {

                        batch.delete(
                            doc.ref
                        );

                    }
                );


                await batch.commit();


                alert(
                    "Losowanie 2026 zostało zresetowane."
                );


                adminLogs.innerHTML =
                    "";


                resultDiv.innerHTML =
                    "";


                qrCodeDiv.innerHTML =
                    "";


                await updateEverything();


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    "Wystąpił błąd podczas resetowania."
                );

            }

        }
    );


// ============================================================

updateEverything();

setupRealtimeUpdates();


</script>
