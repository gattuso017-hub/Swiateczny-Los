<!DOCTYPE html>

<html lang="pl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Świąteczny Los</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        font-family: Arial, sans-serif;
        background: url('https://i.ibb.co/tBf5G6/christmas-bg.jpg')
            no-repeat center center fixed;
        background-size: cover;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
    }

    .container {
        background-color: rgba(0, 0, 0, 0.72);
        padding: 35px;
        border-radius: 20px;
        width: 100%;
        max-width: 700px;
        text-align: center;
        box-sizing: border-box;
    }

    h1 {
        color: #ffdd00;
        text-shadow: 2px 2px #b30000;
        cursor: pointer;
        margin-top: 0;
    }

    #availableUsers {
        margin-bottom: 20px;
        font-weight: bold;
        font-size: 16px;
        background-color: rgba(255, 255, 255, 0.9);
        color: #000;
        padding: 12px;
        border-radius: 8px;
    }

    label {
        font-size: 17px;
        font-weight: bold;
    }

    #name {
        padding: 12px;
        font-size: 17px;
        margin: 12px;
        border-radius: 8px;
        border: 2px solid #ffdd00;
        width: 80%;
        max-width: 350px;
        box-sizing: border-box;
    }

    #groupButtons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 20px;
        margin-bottom: 20px;
    }

    .groupButton {
        padding: 18px 10px;
        font-size: 20px;
        font-weight: bold;
        background-color: #b30000;
        color: white;
        border: 3px solid #ffdd00;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s;
        margin: 0;
    }

    .groupButton:hover:not(:disabled) {
        background-color: #ff3333;
        transform: scale(1.03);
    }

    .groupButton.selected {
        background-color: #ffdd00;
        color: #8b0000;
        border-color: white;
        transform: scale(1.03);
    }

    .groupButton:disabled {
        background-color: #666;
        border-color: #888;
        color: #bbb;
        cursor: not-allowed;
        opacity: 0.65;
        transform: none;
    }

    #drawButton {
        padding: 14px 30px;
        font-size: 19px;
        background-color: #b30000;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
    }

    #drawButton:hover:not(:disabled) {
        background-color: #ff3333;
    }

    #drawButton:disabled {
        background-color: #777;
        cursor: not-allowed;
    }

    #result {
        margin-top: 20px;
        font-weight: bold;
        font-size: 18px;
        background-color: rgba(255, 255, 255, 0.9);
        color: #000;
        padding: 15px;
        border-radius: 10px;
        min-height: 20px;
    }

    #qrcode {
        margin-top: 25px;
        display: flex;
        justify-content: center;
    }

    #adminPanel {
        margin-top: 30px;
        display: none;
        background-color: rgba(255, 255, 255, 0.95);
        color: #000;
        padding: 15px;
        border-radius: 10px;
    }

    #logs {
        width: 95%;
        max-width: 600px;
        box-sizing: border-box;
    }

    .adminButton {
        padding: 10px 15px;
        font-size: 15px;
        background-color: #555;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 5px;
    }

    .adminButton:hover {
        background-color: #333;
    }

    .resetButton {
        background-color: #8b0000;
    }

    .resetButton:hover {
        background-color: #b30000;
    }

    .adminInfo {
        font-size: 13px;
        margin-top: 10px;
    }

    @media (max-width: 500px) {
        .container {
            padding: 20px;
        }

        #groupButtons {
            grid-template-columns: 1fr;
        }

        .groupButton {
            padding: 16px;
            font-size: 19px;
        }

        h1 {
            font-size: 25px;
        }
    }
</style>

</head>

<body>

<div class="container">

<h1>🎄 Świąteczny Los 🎄</h1>

<div id="availableUsers">
    Ładowanie...
</div>

<label for="name">
    Wpisz swój login:
</label>

<br>

<input
    type="text"
    id="name"
    placeholder="Twoje imię"
    autocomplete="off"
>

<div style="margin-top: 15px;">
    <strong>Wybierz grupę:</strong>
</div>

<div id="groupButtons">

    <button
        class="groupButton"
        data-group="1"
        onclick="selectGroup(1)"
    >
        GRUPA A
    </button>

    <button
        class="groupButton"
        data-group="2"
        onclick="selectGroup(2)"
    >
        GRUPA B
    </button>

    <button
        class="groupButton"
        data-group="3"
        onclick="selectGroup(3)"
    >
        GRUPA C
    </button>

    <button
        class="groupButton"
        data-group="4"
        onclick="selectGroup(4)"
    >
        GRUPA D
    </button>

    <button
        class="groupButton"
        data-group="5"
        onclick="selectGroup(5)"
    >
        GRUPA E
    </button>

</div>

<button
    id="drawButton"
    onclick="drawGroup()"
    disabled
>
    🎁 Losuj grupę
</button>

<div id="result"></div>

<div id="qrcode"></div>


<!-- PANEL ADMINISTRATORA -->

<div id="adminPanel">

    <h2>👑 Panel Administratora</h2>

    <h3>Logi losowania 2026</h3>

    <textarea
        id="logs"
        rows="12"
        readonly
    ></textarea>

    <br>

    <button
        class="adminButton"
        onclick="loadLogs()"
    >
        🔄 Odśwież logi
    </button>

    <button
        class="adminButton resetButton"
        onclick="resetCurrentYear()"
    >
        🗑️ Resetuj losowanie 2026
    </button>

    <div class="adminInfo">
        Reset usuwa tylko wyniki z 2026.
        <br>
        Dane z poprzednich lat pozostają w bazie.
    </div>

</div>

</div>

<script> /* ========================================= USTAWIENIA ========================================= */ const CURRENT_YEAR = 2026; const ADMIN_PASSWORD = 'Visiativ17'; /* ========================================= FIREBASE ========================================= */ const firebaseConfig = { apiKey: "AIzaSyCsLwn69mSEbZNJOnaEKxZMEBGc_9nF3j4", authDomain: "swiateczny-los.firebaseapp.com", projectId: "swiateczny-los", storageBucket: "swiateczny-los.firebasestorage.app", messagingSenderId: "106728824953", appId: "1:106728824953:web:0b317e165afecc3fb734a8" }; firebase.initializeApp(firebaseConfig); const db = firebase.firestore(); /* ========================================= GRUPY ========================================= */ const groups = { 1: [ 'Anna', 'Jan' ], 2: [ 'Madzia', 'Kazek', 'Ania', 'Mikołaj' ], 3: [ 'Kasia', 'Kamil', 'Franuś' ], 4: [ 'Sabina', 'Artur', 'Wiktoria' ], 5: [ 'Madzia', 'Jarek', 'Krzyś' ] }; /* ========================================= UŻYTKOWNICY ========================================= */ const users = [ 'Kasia', 'Jarek', 'Sabina', 'Anna', 'Magda' ]; /* ========================================= GRUPY UŻYTKOWNIKÓW ========================================= */ const userGroups = { Kasia: 3, Jarek: 5, Sabina: 4, Anna: 1, Magda: 2 }; /* ========================================= ZMIENNE ========================================= */ let selectedGroup = null; const resultDiv = document.getElementById('result'); const availableDiv = document.getElementById('availableUsers'); const drawButton = document.getElementById('drawButton'); const nameInput = document.getElementById('name'); /* ========================================= ID DOKUMENTÓW ========================================= */ function drawDocumentId(user) { return CURRENT_YEAR + '_' + user; } function groupDocumentId(groupNum) { return CURRENT_YEAR + '_' + groupNum; } /* ========================================= LITERY GRUP ========================================= */ function groupLetter(groupNum) { return String.fromCharCode(64 + groupNum); } /* ========================================= POBIERANIE ZAJĘTYCH GRUP ========================================= */ async function getTakenGroups() { const snapshot = await db .collection('groupLocks') .where('year', '==', CURRENT_YEAR) .get(); return snapshot.docs.map( doc => doc.data().groupNum ); } /* ========================================= SPRAWDZENIE CZY UŻYTKOWNIK JUŻ LOSOWAŁ ========================================= */ async function getUserDraw(user) { const doc = await db .collection('draws') .doc(drawDocumentId(user)) .get(); if (!doc.exists) { return null; } return doc.data(); } /* ========================================= AKTUALIZACJA LISTY DOSTĘPNYCH UŻYTKOWNIKÓW WAŻNE: Lista jest liczona na podstawie kolekcji "draws", czyli osób, które FAKTYCZNIE już oddały głos. ========================================= */ async function updateAvailableUsers() { try { const snapshot = await db .collection('draws') .where('year', '==', CURRENT_YEAR) .get(); const drawnUsers = snapshot.docs.map( doc => doc.data().user ); const availableUsers = users.filter( user => !drawnUsers.includes(user) ); if (availableUsers.length > 0) { availableDiv.textContent = 'Dostępni do losowania: ' + availableUsers.join(', '); } else { availableDiv.textContent = '🎉 Wszyscy już dokonali losowania!'; } } catch (error) { console.error(error); availableDiv.textContent = '⚠️ Problem z połączeniem z bazą danych.'; } } /* ========================================= AKTUALIZACJA PRZYCISKÓW GRUP ========================================= */ async function updateGroupButtons() { try { const takenGroups = await getTakenGroups(); const name = nameInput.value.trim(); const ownGroup = userGroups[name]; document .querySelectorAll('.groupButton') .forEach(button => { const groupNum = Number(button.dataset.group); if ( takenGroups.includes(groupNum) ) { button.disabled = true; button.textContent = 'GRUPA ' + groupLetter(groupNum) + ' ✓'; return; } if ( name && groupNum === ownGroup ) { button.disabled = true; button.textContent = 'GRUPA ' + groupLetter(groupNum) + ' — TWOJA'; return; } button.disabled = false; button.textContent = 'GRUPA ' + groupLetter(groupNum); }); } catch (error) { console.error(error); } } /* ========================================= AKTUALIZACJA WSZYSTKICH DANYCH ========================================= */ async function updateEverything() { await updateGroupButtons(); await updateAvailableUsers(); } /* ========================================= WYBÓR GRUPY ========================================= */ async function selectGroup(groupNum) { const name = nameInput.value.trim(); if (!users.includes(name)) { resultDiv.textContent = 'Najpierw wpisz poprawny login: ' + users.join(', '); return; } if (groupNum === userGroups[name]) { resultDiv.textContent = '🚫 Nie możesz wybrać swojej własnej grupy!'; return; } try { const takenGroups = await getTakenGroups(); if (takenGroups.includes(groupNum)) { resultDiv.textContent = '⚠️ Ta grupa została już wybrana.'; await updateEverything(); return; } const existing = await getUserDraw(name); if (existing) { resultDiv.textContent = '⚠️ ' + name + ', już dokonałeś wyboru. ' + 'Wybrałeś Grupę ' + existing.groupNum + ': ' + existing.members; drawButton.disabled = true; return; } selectedGroup = groupNum; document .querySelectorAll('.groupButton') .forEach(button => { button.classList.remove('selected'); }); document .querySelector( `.groupButton[data-group="${groupNum}"]` ) .classList.add('selected'); resultDiv.textContent = 'Wybrana: GRUPA ' + groupLetter(groupNum); drawButton.disabled = false; } catch (error) { console.error(error); resultDiv.textContent = '❌ Nie udało się sprawdzić danych.'; } } /* ========================================= ZMIANA LOGINU ========================================= */ nameInput.addEventListener( 'input', async function() { selectedGroup = null; drawButton.disabled = true; document .querySelectorAll('.groupButton') .forEach(button => { button.classList.remove('selected'); }); resultDiv.textContent = ''; await updateEverything(); } ); /* ========================================= LOSOWANIE ========================================= */ async function drawGroup() { const name = nameInput.value.trim(); if (!users.includes(name)) { resultDiv.textContent = 'Niepoprawny login. Wpisz jedno z: ' + users.join(', '); return; } if (!selectedGroup) { resultDiv.textContent = 'Najpierw wybierz grupę.'; return; } if ( selectedGroup === userGroups[name] ) { resultDiv.textContent = '🚫 Nie możesz wybrać swojej własnej grupy!'; return; } drawButton.disabled = true; resultDiv.textContent = '⏳ Zapisuję Twój wybór...'; try { const chosenGroup = selectedGroup; /* * TRANSAKCJA FIREBASE * * Dzięki temu dwie osoby * nie mogą jednocześnie * zająć tej samej grupy. */ const result = await db.runTransaction( async transaction => { const userRef = db .collection('draws') .doc( drawDocumentId(name) ); const groupRef = db .collection('groupLocks') .doc( groupDocumentId( chosenGroup ) ); const userDoc = await transaction.get( userRef ); const groupDoc = await transaction.get( groupRef ); if (userDoc.exists) { throw new Error( 'USER_ALREADY_DREW' ); } if (groupDoc.exists) { throw new Error( 'GROUP_ALREADY_TAKEN' ); } const members = groups[chosenGroup].join(', '); const now = new Date().toISOString(); transaction.set( userRef, { year: CURRENT_YEAR, timestamp: now, user: name, groupNum: chosenGroup, members: members } ); transaction.set( groupRef, { year: CURRENT_YEAR, groupNum: chosenGroup, user: name, timestamp: now } ); return { members: members, groupNum: chosenGroup }; } ); resultDiv.textContent = '🎉 Gratulacje ' + name + '! Wybrałeś GRUPĘ ' + groupLetter(result.groupNum) + '. Członkowie grupy: ' + result.members; selectedGroup = null; document .querySelectorAll('.groupButton') .forEach(button => { button.classList.remove( 'selected' ); }); /* * Natychmiastowa aktualizacja * po zakończeniu losowania. */ await updateEverything(); } catch (error) { console.error(error); if ( error.message === 'USER_ALREADY_DREW' ) { const existing = await getUserDraw(name); if (existing) { resultDiv.textContent = '⚠️ ' + name + ', już dokonałeś wyboru. ' + 'Wybrałeś Grupę ' + existing.groupNum + ': ' + existing.members; } } else if ( error.message === 'GROUP_ALREADY_TAKEN' ) { resultDiv.textContent = '⚠️ Ta grupa została właśnie ' + 'wybrana przez inną osobę. ' + 'Wybierz inną grupę.'; await updateEverything(); } else { resultDiv.textContent = '❌ Nie udało się zapisać wyboru. ' + 'Sprawdź połączenie z Firebase.'; } } finally { drawButton.disabled = !selectedGroup; } } /* ========================================= AUTOMATYCZNY NASŁUCH FIREBASE To jest najważniejsza poprawka. Kiedy Sabina odda głos, wszystkie otwarte strony automatycznie dostaną zmianę. ========================================= */ function setupRealtimeUpdates() { /* * Nasłuchujemy zmian w "draws". * Dzięki temu lista użytkowników * aktualizuje się automatycznie. */ db .collection('draws') .where('year', '==', CURRENT_YEAR) .onSnapshot( snapshot => { const drawnUsers = snapshot.docs.map( doc => doc.data().user ); const availableUsers = users.filter( user => !drawnUsers.includes(user) ); if ( availableUsers.length > 0 ) { availableDiv.textContent = 'Dostępni do losowania: ' + availableUsers.join(', '); } else { availableDiv.textContent = '🎉 Wszyscy już dokonali losowania!'; } }, error => { console.error( 'Błąd nasłuchiwania draws:', error ); availableDiv.textContent = '⚠️ Problem z aktualizacją listy.'; } ); /* * Osobny nasłuch dla zajętych grup. */ db .collection('groupLocks') .where('year', '==', CURRENT_YEAR) .onSnapshot( () => { updateGroupButtons(); }, error => { console.error( 'Błąd nasłuchiwania grup:', error ); } ); } /* ========================================= PANEL ADMINISTRATORA ========================================= */ function showAdminPanel() { const password = prompt( 'Podaj hasło administratora:' ); if ( password !== ADMIN_PASSWORD ) { alert( 'Niepoprawne hasło' ); return; } document .getElementById('adminPanel') .style.display = 'block'; loadLogs(); } /* ========================================= LOGI ========================================= */ async function loadLogs() { const logsArea = document.getElementById('logs'); logsArea.value = '⏳ Ładowanie...'; try { const snapshot = await db .collection('draws') .where( 'year', '==', CURRENT_YEAR ) .get(); if (snapshot.empty) { logsArea.value = 'Brak losowań w 2026.'; return; } const logs = snapshot.docs .map(doc => doc.data()) .sort( (a, b) => a.timestamp.localeCompare( b.timestamp ) ); logsArea.value = logs .map(log => { return ( log.timestamp + ' - ' + log.user + ' wybrał GRUPĘ ' + groupLetter( log.groupNum ) + ' (' + log.members + ')' ); }) .join('\n'); } catch (error) { console.error(error); logsArea.value = '❌ Nie udało się pobrać logów.\n\n' + error.message; } } /* ========================================= RESET 2026 ========================================= */ async function resetCurrentYear() { const confirmation = prompt( 'Aby potwierdzić reset 2026, wpisz: RESET' ); if ( confirmation !== 'RESET' ) { alert( 'Reset anulowany.' ); return; } try { /* * USUWANIE LOSOWAŃ */ let snapshot = await db .collection('draws') .where( 'year', '==', CURRENT_YEAR ) .get(); let batch = db.batch(); snapshot.docs.forEach( doc => { batch.delete( doc.ref ); } ); await batch.commit(); /* * USUWANIE BLOKAD GRUP */ snapshot = await db .collection('groupLocks') .where( 'year', '==', CURRENT_YEAR ) .get(); batch = db.batch(); snapshot.docs.forEach( doc => { batch.delete( doc.ref ); } ); await batch.commit(); selectedGroup = null; resultDiv.textContent = '♻️ Losowanie 2026 zostało zresetowane.'; document .querySelectorAll('.groupButton') .forEach(button => { button.classList.remove( 'selected' ); }); await updateEverything(); document .getElementById('logs') .value = 'Losowanie 2026 zostało zresetowane.'; alert( 'Losowanie 2026 zostało zresetowane.' ); } catch (error) { console.error(error); alert( '❌ Nie udało się wykonać resetu.\n\n' + error.message ); } } /* ========================================= PODWÓJNE KLIKNIĘCIE W NAPIS OTWIERA PANEL ADMINA ========================================= */ document .querySelector('h1') .addEventListener( 'dblclick', showAdminPanel ); /* ========================================= START APLIKACJI ========================================= */ updateEverything(); setupRealtimeUpdates(); /* ========================================= KOD QR ========================================= */ new QRCode( document.getElementById('qrcode'), { text: window.location.href, width: 128, height: 128 } ); </script>

</body> </html>
